<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Club Beneficios Aeropuerto Santiago</title>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="stage">

    <div class="phone">

        <div id="chat" class="screen active">

            <div class="message incoming">
                Hola 👋<br>
                Llego a las 9 PM
            </div>

            <div class="message outgoing hidden">
                Ok, no hay problema 👍
            </div>

        </div>

        <div id="dashboard" class="screen">

            <h1>Club Beneficios</h1>

            <div class="welcome">
                Bienvenido Ricardo
            </div>

            <div class="card parking">
                🅿 Parking Premium
            </div>

            <div class="card restaurant">
                🍽 Restaurante
            </div>

            <div class="card gift">
                🎁 Regalo de Bienvenida
            </div>

        </div>

        <div id="summary" class="screen">

            <h1>Todo listo</h1>

            <div class="success">
                ✓ Parking Reservado
            </div>

            <div class="success">
                ✓ Mesa Confirmada
            </div>

            <div class="success">
                ✓ Regalo Comprado
            </div>

        </div>

        <div id="closing" class="screen">

            <h2>
                No vas al aeropuerto
            </h2>

            <h1>
                El aeropuerto te acompaña
            </h1>

            <div class="logo">
                Club Beneficios<br>
                Aeropuerto Santiago
            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
