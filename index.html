<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club Beneficios Aeropuerto Santiago</title>

<link rel="stylesheet" href="styles.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

</head>

<body>

<div class="stage">

    <div class="phone">

        <div class="dynamic-island"></div>

        <div class="status-bar">
            <div class="progress">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="notification">

            <div class="notif-header">
                WhatsApp
            </div>

            <div class="notif-body">
                Hola 👋<br>
                Llego a las 9 PM
            </div>

        </div>

        <div class="reply">

            Ok, no hay problema 👍

        </div>

        <div class="app-badge">

            <div class="app-icon">
                ✈
            </div>

            <div class="app-name">
                Club Beneficios
            </div>

        </div>

        <div class="action-card">

            <div class="card-title">—</div>

            <div class="card-status">—</div>

        </div>

        <div class="stack">

            <div class="stack-item">
                ✅ Parking Confirmado
            </div>

            <div class="stack-item">
                ✅ Mesa Confirmada
            </div>

            <div class="stack-item">
                ✅ Regalo Comprado
            </div>

        </div>

        <div class="closing">

            <div class="closing-copy">

                <h2>
                    No vas al aeropuerto
                </h2>

                <h1>
                    El aeropuerto te acompaña
                </h1>

                <div class="logo">
                    Club Beneficios<br>
                    Aeropuerto Santiago
                </div>

            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>

</html>
